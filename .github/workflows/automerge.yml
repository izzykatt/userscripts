name: automerge

# Enables GitHub auto-merge on pull requests opened by dependabot or by a
# member of the owning organisation, acting as the izzykatt-ci GitHub App - so the merge is
# performed by the bot, never by a personal account, and only once every
# required check on main's ruleset has passed.
#
# pull_request_target, not pull_request: dependabot's PRs run `pull_request`
# with a read-only token and NO repository secrets, so the app credentials
# would be unreachable. pull_request_target runs in the base branch's context
# with secrets. That is safe here because nothing from the PR is checked out
# or executed - the job only asks GitHub to arm auto-merge.
#
# push-to-main and workflow_dispatch SWEEP every open eligible PR. Without the
# sweep a PR that predates this workflow, or one opened before the app
# credentials existed, would sit mergeable forever with nobody to arm it.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  # Daily sweep as well: a PR can outlive its own events (arming failed while
  # a permission was still pending, dependabot opened it during an outage) and
  # main may not move for weeks in a repo this small.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      # --auto: GitHub merges when the ruleset is satisfied (both required
      # checks green, threads resolved). Squash is the only linear method the
      # ruleset allows besides rebase; squash keeps one commit per PR.
      # Arming an already-armed PR is a no-op, so the sweep is idempotent.
      - run: |
          set -eu
          # Eligible: dependabot, or anyone with write/maintain/admin on this
          # repository - asked of the API with the app token, so PRIVATE org
          # membership counts. author_association could not be used: for a
          # member whose membership is private the event reports CONTRIBUTOR,
          # and repository_owner is the org name, never a login. No account is
          # named here.
          eligible() {
            [ "$1" = "dependabot[bot]" ] && return 0
            perm=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in admin|maintain|write) return 0 ;; *) return 1 ;; esac
          }
          if [ "$EVENT" = "pull_request_target" ]; then
            [ "$PR_DRAFT" = "false" ] || exit 0
            eligible "$PR_AUTHOR" || { echo "not eligible: $PR_AUTHOR"; exit 0; }
            gh pr merge --auto --squash "$PR_URL"
            exit 0
          fi
          gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft == false) | "\(.user.login) \(.html_url)"' \
          | while read -r author url; do
              eligible "$author" || { echo "not eligible: $author $url"; continue; }
              echo "arming $url"
              gh pr merge --auto --squash "$url" || echo "  (skipped: $url)"
            done
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
