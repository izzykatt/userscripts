name: nix

# ADDITIVE, AND DELIBERATELY NOT REQUIRED BY `main`'s RULESET. The two checks
# that gate a merge stay `eslint + meta` and `node --check` in lint.yml. This
# job runs the SAME gates through the flake, plus four the npm path cannot run
# (actionlint+shellcheck over the workflows, typos, markdownlint, nixfmt), so a
# green `nix flake check` locally means the same thing it means here.
#
# Keeping it out of the ruleset is the point: a Nix installer having a bad day
# must never be able to block a one-line selector fix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # Fails the job if flake.lock drifts onto an unsupported or stale
      # nixpkgs. Cheap, and it catches a lock that quietly stopped receiving
      # security fixes.
      - uses: DeterminateSystems/flake-checker-action@v14

      # Every gate that can run offline: eslint (node_modules built from
      # package-lock.json, no npm install), meta-lint, node --check, actionlint,
      # typos, markdownlint, nixfmt, and a shellcheck pass over every command in
      # the flake.
      - run: nix flake check --print-build-logs
